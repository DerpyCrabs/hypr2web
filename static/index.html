<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>hypr2web</title>
<style>
      :root {
        color-scheme: dark;
        --bg: #111416;
        --panel: #1c2227;
        --panel-2: #252d33;
        --text: #eef2f3;
        --muted: #a8b3b8;
        --accent: #3fb58f;
        --danger: #d96c6c;
        --border: #354047;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font: 14px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overflow: hidden;
        overscroll-behavior: none;
        user-select: none;
      }

      .shell {
        display: block;
        min-height: 100vh;
      }

      header {
        align-items: center;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        display: flex;
        gap: 12px;
        left: 0;
        min-height: 48px;
        padding: 8px 12px;
        position: fixed;
        right: 0;
        top: 0;
        z-index: 10;
      }

      .shell.connected header {
        opacity: 0.18;
        transform: translateY(calc(-100% + 6px));
        transition: opacity 120ms ease, transform 120ms ease;
      }

      .shell.connected header:hover,
      .shell.connected header:focus-within {
        opacity: 1;
        transform: translateY(0);
      }

      .shell.has-error header {
        opacity: 1;
        transform: translateY(0);
      }

      main {
        height: 100vh;
      }

      .brand {
        font-weight: 650;
        margin-right: auto;
      }

      .metrics {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        min-width: 64px;
        text-align: right;
        white-space: nowrap;
      }

      .metrics.active {
        color: var(--text);
      }

      .status {
        color: var(--muted);
        min-width: 120px;
        overflow: hidden;
        text-align: right;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .status.connected {
        color: var(--accent);
      }

      .status.error {
        color: var(--danger);
      }

      .size-controls {
        align-items: center;
        display: inline-flex;
        gap: 6px;
        flex: 0 0 auto;
      }

      .size-controls[hidden] {
        display: none;
      }

      select {
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        font: inherit;
        height: 32px;
        min-width: 118px;
        padding: 0 8px;
      }

      select:disabled {
        color: var(--muted);
      }

      .icon-button {
        align-items: center;
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        cursor: pointer;
        display: inline-flex;
        height: 32px;
        justify-content: center;
        padding: 0;
        width: 32px;
      }

      .icon-button:disabled {
        color: var(--muted);
        cursor: default;
      }

      .icon-button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .text-button {
        padding: 0 10px;
        width: auto;
      }

      .fullscreen-icon {
        background:
          linear-gradient(currentColor, currentColor) left top / 7px 2px no-repeat,
          linear-gradient(currentColor, currentColor) left top / 2px 7px no-repeat,
          linear-gradient(currentColor, currentColor) right top / 7px 2px no-repeat,
          linear-gradient(currentColor, currentColor) right top / 2px 7px no-repeat,
          linear-gradient(currentColor, currentColor) left bottom / 7px 2px no-repeat,
          linear-gradient(currentColor, currentColor) left bottom / 2px 7px no-repeat,
          linear-gradient(currentColor, currentColor) right bottom / 7px 2px no-repeat,
          linear-gradient(currentColor, currentColor) right bottom / 2px 7px no-repeat;
        display: block;
        height: 16px;
        width: 16px;
      }

      .stage {
        align-items: center;
        display: flex;
        height: 100%;
        justify-content: center;
        overflow: hidden;
        position: relative;
        width: 100%;
      }

      canvas {
        background: #050607;
        box-shadow: 0 0 0 1px var(--border);
        cursor: default;
        display: block;
        height: auto;
        image-rendering: auto;
        max-height: 100%;
        max-width: 100%;
        outline: none;
        touch-action: none;
        width: auto;
      }

      .empty {
        color: var(--muted);
        left: 50%;
        position: absolute;
        text-align: center;
        top: 50%;
        transform: translate(-50%, -50%);
      }

body{height:100dvh;display:flex;flex-direction:column}main{flex:1;min-height:0;height:100dvh;display:grid;place-items:center;overflow:hidden}header{flex-wrap:wrap}header .brand{margin-right:auto}header select{min-width:65px}#statsOverlay{position:fixed;bottom:12px;left:12px;z-index:12;background:#111e;color:#b9c7cc;border:1px solid var(--border);padding:10px 12px;border-radius:6px;font:12px/1.8 ui-monospace,monospace;white-space:pre;pointer-events:none}#error{position:fixed;bottom:12px;left:12px;background:#291b1b;color:#ffb3b3;padding:8px;z-index:13}#error:empty{display:none}.icon-button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}body.connected header{opacity:.18;transform:translateY(calc(-100% + 6px));transition:opacity 120ms,transform 120ms}body.connected header:hover,body.connected header:focus-within,body.has-error header{opacity:1;transform:none}#keys{z-index:11;background:var(--panel);padding:8px;text-align:center}#keys button{background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:8px;min-width:32px}#settings{position:fixed;right:12px;top:55px;padding:12px;background:var(--panel);z-index:11;border:1px solid var(--border);border-radius:6px}#settings label{display:block;margin:8px}video{object-fit:contain;outline:none;touch-action:none;max-width:100%;max-height:100%}video[hidden],canvas[hidden]{display:none}#settings{max-height:75dvh;overflow:auto}</style>
<header><div class="brand">hypr2web</div><div id="fps" class="metrics">0 fps</div><div id="status" class="status">Connecting</div>
<select id="size" aria-label="Resolution"><option value="1280">1280×720</option><option value="1920" selected>1920×1080</option><option value="2560">2560×1440</option><option value="3840">3840×2160</option></select>
<button id="connect" class="icon-button" title="Reconnect" aria-label="Reconnect"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M20 12a8 8 0 1 0-2 6"/></svg></button><button id="pause" class="icon-button" title="Disconnect" aria-label="Disconnect"><svg viewBox="0 0 24 24"><path d="M9 4v16M15 4v16"/></svg></button><button id="release" class="icon-button" title="Release input" aria-label="Release input"><svg viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 2 8M4 4v6h6"/></svg></button><button id="keyboard" class="icon-button" title="Keyboard" aria-label="Keyboard"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h1m3 0h1m3 0h1m3 0h1M6 13h1m3 0h1m3 0h1m3 0h1M8 16h8"/></svg></button><button id="statsToggle" class="icon-button" title="Statistics" aria-label="Statistics"><svg viewBox="0 0 24 24"><path d="M5 19V12M12 19V5M19 19V9"/></svg></button><button id="settingsToggle" class="icon-button" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg></button><button id="fullscreen" class="icon-button" title="Fullscreen" aria-label="Fullscreen"><span class="fullscreen-icon"></span></button></header>
<div id="settings" hidden><label>Transport <select id="transport"><option value="webrtc">WebRTC</option><option value="ws">WebSocket</option></select></label><label><input type="checkbox" id="adaptive"> Auto quality (experimental)</label><label>WebCodecs decoder <select id="decodeMode"><option value="auto">Auto (prefer hardware)</option><option value="no-preference">Browser default</option><option value="prefer-software">Software</option></select></label><label>Frame rate <select id="rate"><option>30</option><option selected>60</option></select></label><label>Bitrate <select id="bitrate"><option value="8000000">8 Mbps</option><option value="16000000" selected>16 Mbps</option><option value="24000000">24 Mbps</option><option value="40000000">40 Mbps</option></select></label><label>Layout <select id="layout"><option value="0">EN</option><option value="1">RU</option></select></label></div>
<main id="stage"><video id="video" autoplay muted playsinline tabindex="0" aria-label="Remote desktop" hidden></video><canvas id="screen" width="1920" height="1080" tabindex="0" aria-label="Remote desktop"></canvas></main>
<div id="keys" hidden></div><div id="statsOverlay" hidden><span id="metrics"></span></div><div id="error"></div>
<script src="/app.js"></script></html>
