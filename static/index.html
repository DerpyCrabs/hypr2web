<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>hypr2web</title>
<style>
      :root {
        color-scheme: dark;
        --bg: #111416;
        --panel: #1c2227;
        --panel-2: #252d33;
        --text: #eef2f3;
        --muted: #a8b3b8;
        --accent: #3fb58f;
        --danger: #d96c6c;
        --border: #354047;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font: 14px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overflow: hidden;
        overscroll-behavior: none;
        user-select: none;
      }

      .shell {
        display: block;
        min-height: 100vh;
      }

      header {
        align-items: center;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        display: flex;
        gap: 12px;
        left: 0;
        min-height: 48px;
        padding: 8px 12px;
        position: fixed;
        right: 0;
        top: 0;
        z-index: 10;
      }

      .shell.connected header {
        opacity: 0.18;
        transform: translateY(calc(-100% + 6px));
        transition: opacity 120ms ease, transform 120ms ease;
      }

      .shell.connected header:hover,
      .shell.connected header:focus-within {
        opacity: 1;
        transform: translateY(0);
      }

      .shell.has-error header {
        opacity: 1;
        transform: translateY(0);
      }

      main {
        height: 100vh;
      }

      .brand {
        font-weight: 650;
        margin-right: auto;
      }

      .metrics {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        min-width: 64px;
        text-align: right;
        white-space: nowrap;
      }

      .metrics.active {
        color: var(--text);
      }

      .status {
        color: var(--muted);
        min-width: 120px;
        overflow: hidden;
        text-align: right;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .status.connected {
        color: var(--accent);
      }

      .status.error {
        color: var(--danger);
      }

      .size-controls {
        align-items: center;
        display: inline-flex;
        gap: 6px;
        flex: 0 0 auto;
      }

      .size-controls[hidden] {
        display: none;
      }

      select {
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        font: inherit;
        height: 32px;
        min-width: 118px;
        padding: 0 8px;
      }

      select:disabled {
        color: var(--muted);
      }

      .icon-button {
        align-items: center;
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        cursor: pointer;
        display: inline-flex;
        height: 32px;
        justify-content: center;
        padding: 0;
        width: 32px;
      }

      .icon-button:disabled {
        color: var(--muted);
        cursor: default;
      }

      .icon-button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .text-button {
        padding: 0 10px;
        width: auto;
      }

      .fullscreen-icon {
        background:
          linear-gradient(currentColor, currentColor) left top / 7px 2px no-repeat,
          linear-gradient(currentColor, currentColor) left top / 2px 7px no-repeat,
          linear-gradient(currentColor, currentColor) right top / 7px 2px no-repeat,
          linear-gradient(currentColor, currentColor) right top / 2px 7px no-repeat,
          linear-gradient(currentColor, currentColor) left bottom / 7px 2px no-repeat,
          linear-gradient(currentColor, currentColor) left bottom / 2px 7px no-repeat,
          linear-gradient(currentColor, currentColor) right bottom / 7px 2px no-repeat,
          linear-gradient(currentColor, currentColor) right bottom / 2px 7px no-repeat;
        display: block;
        height: 16px;
        width: 16px;
      }

      .stage {
        align-items: center;
        display: flex;
        height: 100%;
        justify-content: center;
        overflow: hidden;
        position: relative;
        width: 100%;
      }

      canvas {
        background: #050607;
        box-shadow: 0 0 0 1px var(--border);
        cursor: default;
        display: block;
        height: auto;
        image-rendering: auto;
        max-height: 100%;
        max-width: 100%;
        outline: none;
        touch-action: none;
        width: auto;
      }

      .empty {
        color: var(--muted);
        left: 50%;
        position: absolute;
        text-align: center;
        top: 50%;
        transform: translate(-50%, -50%);
      }

body{height:100dvh;display:flex;flex-direction:column}main{flex:1;min-height:0;height:100dvh;display:grid;place-items:center;overflow:hidden}header{flex-wrap:wrap}header .brand{margin-right:auto}header select{min-width:65px}#statsOverlay{position:fixed;bottom:12px;left:12px;z-index:12;background:#111e;color:#b9c7cc;border:1px solid var(--border);padding:10px 12px;border-radius:6px;font:12px/1.8 ui-monospace,monospace;white-space:pre;pointer-events:none}#error{position:fixed;bottom:12px;left:12px;background:#291b1b;color:#ffb3b3;padding:8px;z-index:13}#error:empty{display:none}.icon-button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}body.connected header{opacity:.18;transform:translateY(calc(-100% + 6px));transition:opacity 120ms,transform 120ms}body.connected header:hover,body.connected header:focus-within,body.has-error header{opacity:1;transform:none}#keys{z-index:11;background:var(--panel);padding:8px;text-align:center}#keys button{background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:8px;min-width:32px}#settings{position:fixed;right:12px;top:55px;padding:12px;background:var(--panel);z-index:11;border:1px solid var(--border);border-radius:6px}#settings label{display:block;margin:8px}</style>
<header><div class="brand">hypr2web</div><div id="fps" class="metrics">0 fps</div><div id="status" class="status">Connecting</div>
<select id="size" aria-label="Resolution"><option value="1280">1280×720</option><option value="1920" selected>1920×1080</option><option value="2560">2560×1440</option><option value="3840">3840×2160</option></select>
<button id="connect" class="icon-button" title="Reconnect" aria-label="Reconnect"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M20 12a8 8 0 1 0-2 6"/></svg></button><button id="pause" class="icon-button" title="Disconnect" aria-label="Disconnect"><svg viewBox="0 0 24 24"><path d="M9 4v16M15 4v16"/></svg></button><button id="release" class="icon-button" title="Release input" aria-label="Release input"><svg viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 2 8M4 4v6h6"/></svg></button><button id="keyboard" class="icon-button" title="Keyboard" aria-label="Keyboard"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h1m3 0h1m3 0h1m3 0h1M6 13h1m3 0h1m3 0h1m3 0h1M8 16h8"/></svg></button><button id="statsToggle" class="icon-button" title="Statistics" aria-label="Statistics"><svg viewBox="0 0 24 24"><path d="M5 19V12M12 19V5M19 19V9"/></svg></button><button id="settingsToggle" class="icon-button" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg></button><button id="fullscreen" class="icon-button" title="Fullscreen" aria-label="Fullscreen"><span class="fullscreen-icon"></span></button></header>
<div id="settings" hidden><label>Frame rate <select id="rate"><option>30</option><option selected>60</option></select></label><label>Bitrate <select id="bitrate"><option value="8000000">8 Mbps</option><option value="16000000" selected>16 Mbps</option><option value="24000000">24 Mbps</option><option value="40000000">40 Mbps</option></select></label><label>Layout <select id="layout"><option value="0">EN</option><option value="1">RU</option></select></label></div>
<main id="stage"><canvas id="screen" width="1920" height="1080" tabindex="0" aria-label="Remote desktop"></canvas></main>
<div id="keys" hidden></div><div id="statsOverlay" hidden><span id="metrics"></span></div><div id="error"></div>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('screen'),ctx=canvas.getContext('2d',{alpha:false});
let ws,decoder,pending,raf=0,received=new Map(),generation=0,drawn=0,lastDrawn=0,lastTick=performance.now(),fps=0;
const h2w=window.h2w={frames:0,captureMs:0,encodeMs:0,drawMs:0,rtt:0,ackMs:0,errors:[],draw};
function send(v){if(ws?.readyState===1)ws.send(JSON.stringify(v))}
function fail(e){const text=e.message||String(e);h2w.errors.push(text);document.body.classList.add('has-error');$('error').textContent=text;disconnect();}
function disconnect(){generation++;send({type:'release'});if(ws){ws.onclose=null;ws.close();ws=null}if(decoder&&decoder.state!=='closed')decoder.close();decoder=null;pending?.close();pending=null;cancelAnimationFrame(raf);raf=0;received.clear();document.body.classList.remove('connected');$('status').textContent='Disconnected'}
function draw(){raf=0;if(!pending)return;const frame=pending;pending=null;const seq=frame.timestamp,m=received.get(seq);if(canvas.width!==frame.displayWidth||canvas.height!==frame.displayHeight){canvas.width=frame.displayWidth;canvas.height=frame.displayHeight;fitCanvas()}ctx.drawImage(frame,0,0);frame.close();if(m){h2w.captureMs=m.capture;h2w.encodeMs=m.encode;h2w.drawMs=performance.now()-m.at}for(const k of received.keys())if(k<=seq)received.delete(k);send({type:'ack',seq});drawn++;h2w.frames++;h2w.lastSeq=seq;}
function fitCanvas(){const r=$('stage').getBoundingClientRect(),scale=Math.min(r.width/canvas.width,r.height/canvas.height);canvas.style.width=(canvas.width*scale)+'px';canvas.style.height=(canvas.height*scale)+'px'}new ResizeObserver(fitCanvas).observe($('stage'));
function nals(data){const out=[];for(let i=0;i+4<data.length;i++){let n=0;if(data[i]===0&&data[i+1]===0){if(data[i+2]===1)n=3;else if(data[i+2]===0&&data[i+3]===1)n=4}if(n){out.push(i+n);i+=n-1}}return out}
async function connect(){disconnect();$('error').textContent='';document.body.classList.remove('has-error');if(!window.VideoDecoder){fail('Нужен браузер с WebCodecs и HTTPS');return}const g=generation;await new Promise(r=>setTimeout(r,350));if(g!==generation)return;const url=new URL('/ws',location.href);url.protocol=location.protocol==='https:'?'wss:':'ws:';url.search=new URLSearchParams({width:$('size').value,fps:$('rate').value,bitrate:$('bitrate').value});ws=new WebSocket(url);ws.binaryType='arraybuffer';$('status').textContent='Connecting';
ws.onopen=()=>{$('status').textContent='Connecting'};
ws.onclose=()=>{if(g===generation){disconnect();$('status').textContent='Disconnected'}};
ws.onerror=()=>{if(g===generation)fail('Не удалось подключиться')};
ws.onmessage=e=>{if(g!==generation)return;try{if(typeof e.data==='string'){const v=JSON.parse(e.data);if(v.type==='error'){fail(v.message);return}if(v.type==='stream'){$('status').textContent='Connected';document.body.classList.add('connected');h2w.stream=v}if(v.type==='stats')h2w.ackMs=v.ackMs;if(v.type==='pong')h2w.rtt=performance.now()-v.at;return}
const h=new DataView(e.data);if(h.byteLength<25||h.getUint32(0,true)!==0x31425748)throw Error('Неверный видеопакет');const seq=h.getUint32(4,true),data=new Uint8Array(e.data,24),units=nals(data),key=units.some(i=>(data[i]&31)===5);
if(!decoder){const sps=units.find(i=>(data[i]&31)===7);if(sps===undefined||!key)throw Error('Нет стартового ключевого кадра');const codec='avc1.'+[data[sps+1],data[sps+2],data[sps+3]].map(v=>v.toString(16).padStart(2,'0')).join('');decoder=new VideoDecoder({output:frame=>{if(g!==generation){frame.close();return}pending?.close();pending=frame;if(!raf)raf=requestAnimationFrame(draw)},error:e=>{if(g===generation)fail(e)}});decoder.configure({codec,optimizeForLatency:true,hardwareAcceleration:'no-preference'});h2w.codec=codec}
received.set(seq,{capture:h.getUint32(8,true)/1000,encode:h.getUint32(12,true)/1000,at:performance.now()});decoder.decode(new EncodedVideoChunk({type:key?'key':'delta',timestamp:seq,data}));
}catch(e){fail(e)}}}
$('connect').onclick=connect;$('pause').onclick=disconnect;$('release').onclick=()=>send({type:'release'});$('fullscreen').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(fail)};$('layout').onchange=()=>send({type:'layout',group:Number($('layout').value)});
for(const id of ['size','rate','bitrate'])$(id).onchange=connect;
function point(e){const r=canvas.getBoundingClientRect();send({type:'pointer',x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height})}
canvas.onpointerdown=e=>{e.preventDefault();canvas.focus();canvas.setPointerCapture(e.pointerId);point(e);send({type:'button',button:e.button,down:true})};
canvas.onpointermove=e=>{point(e)};canvas.onpointerup=e=>{point(e);send({type:'button',button:e.button,down:false});if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId)};canvas.onpointercancel=()=>send({type:'release'});canvas.oncontextmenu=e=>e.preventDefault();
canvas.addEventListener('wheel',e=>{e.preventDefault();send({type:'wheel',delta:e.deltaY*(e.deltaMode===1?16:e.deltaMode===2?240:1)})},{passive:false});
const codes={Escape:1,Minus:12,Equal:13,Backspace:14,Tab:15,BracketLeft:26,BracketRight:27,Enter:28,ControlLeft:29,Semicolon:39,Quote:40,Backquote:41,ShiftLeft:42,Backslash:43,Comma:51,Period:52,Slash:53,ShiftRight:54,AltLeft:56,Space:57,CapsLock:58,NumLock:69,ScrollLock:70,ControlRight:97,AltRight:100,Home:102,ArrowUp:103,PageUp:104,ArrowLeft:105,ArrowRight:106,End:107,ArrowDown:108,PageDown:109,Insert:110,Delete:111,MetaLeft:125,MetaRight:126};
'1234567890'.split('').forEach((c,i)=>codes['Digit'+c]=i+2);
for(const [chars,start]of [['QWERTYUIOP',16],['ASDFGHJKL',30],['ZXCVBNM',44]])[...chars].forEach((c,i)=>codes['Key'+c]=start+i);
for(let i=1;i<=12;i++)codes['F'+i]=i<=10?58+i:76+i;
for(const type of ['keydown','keyup'])canvas.addEventListener(type,e=>{const code=codes[e.code];if(code){e.preventDefault();if(!e.repeat)send({type:'key',code,down:type==='keydown'})}});
const keyPanel=$('keys');
for(const row of [['Esc',1,'Tab',15,'⌫',14,'Enter',28,'Space',57,'←',105,'↑',103,'↓',108,'→',106],...'1234567890 QWERTYUIOP ASDFGHJKL ZXCVBNM'.split(' ').map(chars=>[...chars].flatMap(c=>[c,codes[(isNaN(Number(c))?'Key':'Digit')+c]]))]){const line=document.createElement('div');line.style.margin='3px';for(let i=0;i<row.length;i+=2){const b=document.createElement('button');b.textContent=row[i];b.style.margin='2px';b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);send({type:'key',code:row[i+1],down:true})};b.onpointerup=()=>send({type:'key',code:row[i+1],down:false});b.onpointercancel=()=>send({type:'release'});line.append(b)}keyPanel.append(line)}
for(const [name,code]of [['Shift',42],['Ctrl',29],['Alt',56],['Super',125]]){const b=document.createElement('button');b.textContent=name;b.onclick=()=>{const down=b.dataset.down!=='1';b.dataset.down=down?'1':'0';b.style.background=down?'#31785e':'';send({type:'key',code,down})};keyPanel.append(b)}
$('keyboard').onclick=()=>{keyPanel.hidden=!keyPanel.hidden;send({type:'release'});keyPanel.querySelectorAll('[data-down]').forEach(b=>{b.dataset.down='0';b.style.background=''})};
window.addEventListener('blur',()=>send({type:'release'}));window.addEventListener('pagehide',disconnect);document.addEventListener('visibilitychange',()=>{if(document.hidden)disconnect()});
setInterval(()=>{const now=performance.now();fps=(drawn-lastDrawn)*1000/(now-lastTick);lastDrawn=drawn;lastTick=now;h2w.fps=fps;$('fps').textContent=fps.toFixed(0)+' fps';send({type:'ping',at:now});$('metrics').textContent=fps.toFixed(0)+' fps\nCapture  '+h2w.captureMs.toFixed(1)+' ms\nEncode   '+h2w.encodeMs.toFixed(1)+' ms\nDraw     '+h2w.drawMs.toFixed(1)+' ms\nRTT      '+h2w.rtt.toFixed(1)+' ms\nFrame→ACK '+Number(h2w.ackMs).toFixed(1)+' ms'},1000);
$('statsOverlay').hidden=new URLSearchParams(location.search).get('stats')!=='1';$('statsToggle').onclick=()=>{$('statsOverlay').hidden=!$('statsOverlay').hidden};$('settingsToggle').onclick=()=>{$('settings').hidden=!$('settings').hidden};
connect();
</script></html>
